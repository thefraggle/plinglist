services:
  plinglist-server:
    image: node:22-alpine
    container_name: plinglist-server
    working_dir: /app
    command: ["npm", "run", "start", "--workspace=@plinglist/server"]
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SQLITE_PATH=/app/data/plinglist.db
    volumes:
      - .:/app:ro
      - ./data:/app/data
    ports:
      - "3001:3001"
    restart: unless-stopped

  plinglist-app:
    image: nginx:alpine
    container_name: plinglist-app
    depends_on:
      - plinglist-server
    ports:
      - "8080:80"
    volumes:
      - ./app/dist:/usr/share/nginx/html:ro
    restart: unless-stopped
