services:
  plinglist-app:
    build: .
    container_name: plinglist-app
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3001}
      - SQLITE_PATH=/app/data/plinglist.db
      - CLOUD_EXTENSION_ENABLED=${CLOUD_EXTENSION_ENABLED:-false}
      - CLOUD_ENFORCE_ENTITLEMENTS=${CLOUD_ENFORCE_ENTITLEMENTS:-false}
      - CLOUD_WEBHOOK_SECRET=${CLOUD_WEBHOOK_SECRET:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3001}
    volumes:
      - ./data:/app/data
    ports:
      - "${PORT:-3001}:3001"
    restart: unless-stopped
