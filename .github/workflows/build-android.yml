name: Build & Release Android

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      target_action:
        description: 'Build & upload AAB + Play Store metadata, build APK only, or sync metadata/screenshots only'
        required: true
        default: 'build-and-upload'
        type: choice
        options:
          - build-and-upload
          - apk-only
          - metadata-only
      version_code:
        description: 'Android versionCode (auto = next free Google Play versionCode)'
        required: true
        default: 'auto'
        type: string
      play_track:
        description: 'Target Google Play track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Android (${{ inputs.target_action || 'build-and-upload' }})
    runs-on: ubuntu-latest
    env:
      PLAY_PACKAGE_NAME: de.goork.plinglist

    steps:
      - name: Checkout Plinglist
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Private Cloud Overlay (optional)
        env:
          CLOUD_SSH_KEY: ${{ secrets.CLOUD_SSH_KEY }}
        run: |
          if [ -n "$CLOUD_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            (umask 077 && echo "$CLOUD_SSH_KEY" > ~/.ssh/plinglist_cloud_key)
            ssh-keyscan -p 2222 forgejo.goork.de >> ~/.ssh/known_hosts 2>/dev/null || true
            GIT_SSH_COMMAND="ssh -i ~/.ssh/plinglist_cloud_key -o IdentitiesOnly=yes" \
              git clone ssh://git@forgejo.goork.de:2222/thefraggle/plinglist-cloud.git cloud || true
            rm -f ~/.ssh/plinglist_cloud_key
          else
            echo "CLOUD_SSH_KEY not configured; continuing with open-core assets."
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Overlay (if present), Build & Test
        run: |
          if [ -d cloud/scripts ]; then
            node cloud/scripts/generate-brand-icons.mjs || true
            bash cloud/scripts/apply-brand-overlay.sh || true
          fi
          npm run build
          npm test

      - name: Setup Java JDK 21 (Temurin)
        if: ${{ inputs.target_action != 'metadata-only' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize & Sync Capacitor 7 Android Project
        if: ${{ inputs.target_action != 'metadata-only' }}
        env:
          VERSION_CODE: ${{ inputs.version_code || 'auto' }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON || secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null || true
          fi

          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7 @capacitor/local-notifications@7
          npx cap add android
          if [ -d cloud/scripts ]; then
            bash cloud/scripts/apply-brand-overlay.sh || true
          fi
          npx cap sync android

          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          APP_VERSION="$APP_VERSION" VERSION_CODE="$VERSION_CODE" node - <<'EOF'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          async function resolveNextPlayVersionCode() {
            const saRaw = process.env.SERVICE_ACCOUNT_JSON;
            if (!saRaw) return 0;
            try {
              const sa = JSON.parse(saRaw);
              const now = Math.floor(Date.now() / 1000);
              const b64u = (o) => Buffer.from(JSON.stringify(o)).toString('base64url');
              const input = `${b64u({ alg: 'RS256', typ: 'JWT' })}.${b64u({
                iss: sa.client_email,
                scope: 'https://www.googleapis.com/auth/androidpublisher',
                aud: 'https://oauth2.googleapis.com/token',
                iat: now,
                exp: now + 300,
              })}`;
              const sig = crypto.sign('RSA-SHA256', Buffer.from(input), sa.private_key).toString('base64url');
              const tokRes = await fetch('https://oauth2.googleapis.com/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                  grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                  assertion: `${input}.${sig}`,
                }),
              });
              const { access_token } = await tokRes.json();
              if (!access_token) return 0;

              const base = `https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${encodeURIComponent(process.env.PLAY_PACKAGE_NAME || 'de.goork.plinglist')}`;
              const editRes = await fetch(`${base}/edits`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${access_token}`, 'Content-Type': 'application/json' },
                body: '{}',
              });
              if (!editRes.ok) return 0;
              const edit = await editRes.json();
              const bundlesRes = await fetch(`${base}/edits/${edit.id}/bundles`, {
                headers: { Authorization: `Bearer ${access_token}` },
              });
              let maxCode = 0;
              if (bundlesRes.ok) {
                const bData = await bundlesRes.json();
                for (const b of bData.bundles || []) {
                  const code = Number.parseInt(String(b.versionCode ?? '0'), 10);
                  if (Number.isFinite(code) && code > maxCode) maxCode = code;
                }
              }
              await fetch(`${base}/edits/${edit.id}`, {
                method: 'DELETE',
                headers: { Authorization: `Bearer ${access_token}` },
              }).catch(() => {});
              return maxCode;
            } catch (err) {
              console.warn(`Notice: could not query existing Google Play bundles (${err.message})`);
              return 0;
            }
          }

          (async () => {
            const maxPlayVersionCode = await resolveNextPlayVersionCode();
            const reqCode = Number.parseInt(process.env.VERSION_CODE || '0', 10);
            const fallbackCode = Number.parseInt(process.env.RUN_NUMBER || '1', 10) || 1;
            const explicitOrFallback = Number.isFinite(reqCode) && reqCode > 0 ? reqCode : (maxPlayVersionCode > 0 ? 1 : fallbackCode);
            const effectiveVersionCode = Math.max(explicitOrFallback, maxPlayVersionCode + 1);
            console.log(`Resolved Android versionCode: ${effectiveVersionCode} (previous Google Play max: ${maxPlayVersionCode})`);
            fs.appendFileSync(process.env.GITHUB_ENV, `EFFECTIVE_VERSION_CODE=${effectiveVersionCode}\n`);

            const varsPath = 'android/variables.gradle';
            if (fs.existsSync(varsPath)) {
              let vars = fs.readFileSync(varsPath, 'utf8');
              vars = vars.replace(/minSdkVersion\s*=\s*\d+/g, 'minSdkVersion = 26');
              vars = vars.replace(/compileSdkVersion\s*=\s*\d+/g, 'compileSdkVersion = 36');
              vars = vars.replace(/targetSdkVersion\s*=\s*\d+/g, 'targetSdkVersion = 36');
              fs.writeFileSync(varsPath, vars);
            }

            const gradlePath = 'android/app/build.gradle';
            let gradle = fs.readFileSync(gradlePath, 'utf8');
            gradle = gradle.replace(/minSdkVersion\s+\d+/g, 'minSdkVersion 26');
            gradle = gradle.replace(/compileSdk\s+\d+/g, 'compileSdk 36');
            gradle = gradle.replace(/compileSdkVersion\s+\d+/g, 'compileSdkVersion 36');
            gradle = gradle.replace(/targetSdkVersion\s+\d+/g, 'targetSdkVersion 36');
            gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${effectiveVersionCode}`);
            gradle = gradle.replace(/versionName\s+"[^"]*"/, `versionName "${process.env.APP_VERSION}"`);
            fs.writeFileSync(gradlePath, gradle);

          const propsPath = 'android/gradle.properties';
          if (fs.existsSync(propsPath)) {
            let props = fs.readFileSync(propsPath, 'utf8');
            if (!props.includes('android.suppressUnsupportedCompileSdk')) {
              props += '\nandroid.suppressUnsupportedCompileSdk=36\n';
              fs.writeFileSync(propsPath, props);
            }
          }

            const manifestPath = 'android/app/src/main/AndroidManifest.xml';
            let manifest = fs.readFileSync(manifestPath, 'utf8');
            if (!manifest.includes('android:scheme="plinglist"')) {
              const deepLinkFilters = `
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="plinglist" />
            </intent-filter>
            <intent-filter android:autoVerify="true">
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="https" android:host="plinglist.app" />
            </intent-filter>`;
              manifest = manifest.replace('</activity>', `${deepLinkFilters}\n        </activity>`);
              fs.writeFileSync(manifestPath, manifest);
            }

            const lightStylesPath = 'android/app/src/main/res/values/styles.xml';
            const lightStylesXml = [
              '<?xml version="1.0" encoding="utf-8"?>',
              '<resources>',
              '    <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">',
              '        <item name="colorPrimary">#0D6B58</item>',
              '        <item name="colorPrimaryDark">#F2F5F4</item>',
              '        <item name="colorAccent">#0D6B58</item>',
              '        <item name="android:windowBackground">#F2F5F4</item>',
              '        <item name="android:statusBarColor">#F2F5F4</item>',
              '        <item name="android:navigationBarColor">#FFFFFF</item>',
              '        <item name="android:windowLightStatusBar">true</item>',
              '    </style>',
              '    <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">',
              '        <item name="windowActionBar">false</item>',
              '        <item name="windowNoTitle">true</item>',
              '        <item name="android:windowBackground">#F2F5F4</item>',
              '        <item name="android:statusBarColor">#F2F5F4</item>',
              '        <item name="android:navigationBarColor">#FFFFFF</item>',
              '        <item name="android:windowLightStatusBar">true</item>',
              '    </style>',
              '    <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">',
              '        <item name="android:background">@drawable/splash</item>',
              '    </style>',
              '</resources>',
            ].join('\n') + '\n';
            fs.writeFileSync(lightStylesPath, lightStylesXml);

            fs.mkdirSync('android/app/src/main/res/values-night', { recursive: true });
            const nightStylesPath = 'android/app/src/main/res/values-night/styles.xml';
            const nightStylesXml = [
              '<?xml version="1.0" encoding="utf-8"?>',
              '<resources>',
              '    <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">',
              '        <item name="colorPrimary">#48C9AD</item>',
              '        <item name="colorPrimaryDark">#131615</item>',
              '        <item name="colorAccent">#48C9AD</item>',
              '        <item name="android:windowBackground">#131615</item>',
              '        <item name="android:statusBarColor">#131615</item>',
              '        <item name="android:navigationBarColor">#1C201F</item>',
              '        <item name="android:windowLightStatusBar">false</item>',
              '    </style>',
              '    <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">',
              '        <item name="windowActionBar">false</item>',
              '        <item name="windowNoTitle">true</item>',
              '        <item name="android:windowBackground">#131615</item>',
              '        <item name="android:statusBarColor">#131615</item>',
              '        <item name="android:navigationBarColor">#1C201F</item>',
              '        <item name="android:windowLightStatusBar">false</item>',
              '    </style>',
              '</resources>',
            ].join('\n') + '\n';
            fs.writeFileSync(nightStylesPath, nightStylesXml);

            const mainActivityPath = 'android/app/src/main/java/de/goork/plinglist/MainActivity.java';
            if (fs.existsSync(mainActivityPath)) {
              const javaLines = [
                'package de.goork.plinglist;',
                '',
                'import android.content.Intent;',
                'import android.content.res.Configuration;',
                'import android.os.Bundle;',
                'import android.os.Handler;',
                'import android.os.Looper;',
                'import android.view.View;',
                'import android.webkit.WebView;',
                'import androidx.core.graphics.Insets;',
                'import androidx.core.view.ViewCompat;',
                'import androidx.core.view.WindowCompat;',
                'import androidx.core.view.WindowInsetsCompat;',
                'import androidx.core.view.WindowInsetsControllerCompat;',
                'import com.getcapacitor.BridgeActivity;',
                'import org.json.JSONObject;',
                '',
                'public class MainActivity extends BridgeActivity {',
                '    @Override',
                '    protected void onCreate(Bundle savedInstanceState) {',
                '        super.onCreate(savedInstanceState);',
                '        View contentView = findViewById(android.R.id.content);',
                '        if (contentView != null) {',
                '            ViewCompat.setOnApplyWindowInsetsListener(contentView, (v, windowInsets) -> {',
                '                Insets bars = windowInsets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());',
                '                v.setPadding(bars.left, bars.top, bars.right, bars.bottom);',
                '                return windowInsets;',
                '            });',
                '        }',
                '        applySystemBarTheme();',
                '    }',
                '',
                '    @Override',
                '    public void onResume() {',
                '        super.onResume();',
                '        applySystemBarTheme();',
                '        deliverPlinglistDeepLink(getIntent());',
                '    }',
                '',
                '    @Override',
                '    public void onConfigurationChanged(Configuration newConfig) {',
                '        super.onConfigurationChanged(newConfig);',
                '        applySystemBarTheme();',
                '    }',
                '',
                '    private void applySystemBarTheme() {',
                '        boolean isNight = (getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES;',
                '        int bgColor = isNight ? 0xFF131615 : 0xFFF2F5F4;',
                '        int navColor = isNight ? 0xFF1C201F : 0xFFFFFFFF;',
                '        getWindow().setStatusBarColor(bgColor);',
                '        getWindow().setNavigationBarColor(navColor);',
                '        WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());',
                '        if (controller != null) {',
                '            controller.setAppearanceLightStatusBars(!isNight);',
                '            controller.setAppearanceLightNavigationBars(!isNight);',
                '        }',
                '        View contentView = findViewById(android.R.id.content);',
                '        if (contentView != null) {',
                '            contentView.setBackgroundColor(bgColor);',
                '        }',
                '        if (getBridge() != null && getBridge().getWebView() != null) {',
                '            getBridge().getWebView().setBackgroundColor(bgColor);',
                '        }',
                '    }',
                '',
                '    @Override',
                '    protected void onNewIntent(Intent intent) {',
                '        super.onNewIntent(intent);',
                '        setIntent(intent);',
                '        deliverPlinglistDeepLink(intent);',
                '    }',
                '',
                '    private void deliverPlinglistDeepLink(Intent intent) {',
                '        if (intent == null) return;',
                '        String url = intent.getDataString();',
                '        if (url == null || url.isEmpty()) return;',
                '        boolean matches =',
                '            url.startsWith("plinglist://") ||',
                '            url.contains("pair=") ||',
                '            url.contains("join=") ||',
                '            url.contains("key=") ||',
                '            url.contains("token=");',
                '        if (!matches) return;',
                '',
                '        // Consume once so resume/orientation changes do not replay the deep link.',
                '        intent.setData(null);',
                '',
                '        final String quotedUrl = JSONObject.quote(url);',
                '        final String js =',
                '            "(function(){try{" +',
                '            "var u=" + quotedUrl + ";" +',
                '            "window.__PLINGLIST_LAUNCH_URL__=u;" +',
                '            "window.dispatchEvent(new CustomEvent(\'plinglist:open-url\',{detail:{url:u}}));" +',
                '            "}catch(_e){}})();";',
                '',
                '        final Handler handler = new Handler(Looper.getMainLooper());',
                '        Runnable evalTask = () -> {',
                '            if (getBridge() == null) return;',
                '            WebView webView = getBridge().getWebView();',
                '            if (webView != null) {',
                '                webView.evaluateJavascript(js, null);',
                '            }',
                '        };',
                '        handler.post(evalTask);',
                '        handler.postDelayed(evalTask, 400);',
                '    }',
                '}',
              ];
              fs.writeFileSync(mainActivityPath, javaLines.join('\n') + '\n');
            }
          })().catch((err) => {
            console.error(`::error::${err.message}`);
            process.exit(1);
          });
          EOF

      - name: Build & Sign Android Release APK & AAB
        if: ${{ inputs.target_action != 'metadata-only' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          TARGET_ACTION: ${{ inputs.target_action || 'build-and-upload' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          cd ..

          mkdir -p dist
          KEYSTORE_PATH="$RUNNER_TEMP/plinglist-upload.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            KEY_ALIAS="${KEY_ALIAS:-plinglist}"
            KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            if [ -z "$KEYSTORE_PASSWORD" ]; then
              echo "::error::KEYSTORE_BASE64 is set, but KEYSTORE_PASSWORD secret is missing!"
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"
            echo "Upload certificate fingerprint:"
            keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep -m1 "SHA256:" || true
          elif [ "$TARGET_ACTION" = "apk-only" ]; then
            echo "No KEYSTORE_BASE64 secret configured; generating temporary test signing keystore for apk-only build."
            KEYSTORE_PASSWORD="plinglist-temp-pass"
            KEY_PASSWORD="plinglist-temp-pass"
            KEY_ALIAS="plinglist-temp"
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 365 \
              -dname "CN=Plinglist Test APK, O=Goork, C=DE"
          else
            echo "::error::Missing KEYSTORE_BASE64 secret required for Google Play release signing!"
            exit 1
          fi

          RAW_AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          jarsigner -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$RAW_AAB" "$KEY_ALIAS"
          cp "$RAW_AAB" "dist/Plinglist-v${APP_VERSION}.aab"

          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -p -f -v 4 "$RAW_APK" "$RUNNER_TEMP/aligned.apk" > /dev/null
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "dist/Plinglist-v${APP_VERSION}.apk" \
            "$RUNNER_TEMP/aligned.apk"

          echo "AAB_FILE=dist/Plinglist-v${APP_VERSION}.aab" >> "$GITHUB_ENV"

      - name: Upload Build Artifacts (APK & AAB)
        if: ${{ inputs.target_action != 'metadata-only' }}
        uses: actions/upload-artifact@v4
        with:
          name: plinglist-android-v${{ env.APP_VERSION }}-vc${{ env.EFFECTIVE_VERSION_CODE || inputs.version_code || 'auto' }}
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB & Sync Google Play Store Texts/Graphics
        if: ${{ inputs.target_action != 'apk-only' }}
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON || secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.play_track || 'internal' }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing SERVICE_ACCOUNT_JSON (or GOOGLE_PLAY_SERVICE_ACCOUNT_JSON) secret!"
            exit 1
          fi
          if [ -f cloud/scripts/sync-playstore-metadata.mjs ]; then
            node cloud/scripts/sync-playstore-metadata.mjs
          else
            echo "::error::Missing cloud/scripts/sync-playstore-metadata.mjs (ensure CLOUD_SSH_KEY is configured)."
            exit 1
          fi

      - name: Cleanup Temporary Signing Files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/plinglist-upload.jks" "$RUNNER_TEMP/aligned.apk"
