name: Build & Upload iOS / macOS (Manual)

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Target Apple platform to build & upload (ios covers iPhone, iPad & Apple Silicon Mac)'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - metadata-only
          - macos
          - all
      build_number:
        description: 'CFBundleVersion build number (must increase per App Store upload)'
        required: true
        default: '1'
        type: string
      upload_to_appstore:
        description: 'Upload signed archive(s) to App Store Connect / TestFlight'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apple:
    name: Archive & Upload (${{ inputs.target_platform }})
    runs-on: macos-15
    env:
      APP_BUNDLE_ID: de.goork.plinglist
      APPLE_TEAM_ID: 296C735W8C

    steps:
      - name: Checkout Plinglist
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Private Cloud Overlay (optional)
        env:
          CLOUD_SSH_KEY: ${{ secrets.CLOUD_SSH_KEY }}
        run: |
          if [ -n "$CLOUD_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            (umask 077 && echo "$CLOUD_SSH_KEY" > ~/.ssh/plinglist_cloud_key)
            ssh-keyscan -p 2222 forgejo.goork.de >> ~/.ssh/known_hosts 2>/dev/null || true
            GIT_SSH_COMMAND="ssh -i ~/.ssh/plinglist_cloud_key -o IdentitiesOnly=yes" \
              git clone ssh://git@forgejo.goork.de:2222/thefraggle/plinglist-cloud.git cloud || true
            rm -f ~/.ssh/plinglist_cloud_key
          else
            echo "CLOUD_SSH_KEY not configured; continuing with open-core assets."
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Overlay (if present), Build & Test
        run: |
          if [ -d cloud/scripts ]; then
            node cloud/scripts/generate-brand-icons.mjs || true
            bash cloud/scripts/apply-brand-overlay.sh || true
          fi
          npm run build
          npm test

      - name: Initialize & Sync Capacitor 7 iOS Project (iOS + Mac Catalyst)
        if: ${{ inputs.target_platform != 'metadata-only' }}
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7
          npx cap add ios
          if [ -d cloud/scripts ]; then
            bash cloud/scripts/apply-brand-overlay.sh || true
          fi
          if [ ! -f ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png ]; then
            node - <<'EOF'
          const fs = require('node:fs');
          const path = require('node:path');
          const zlib = require('node:zlib');
          const size = 1024;
          const BG = [13, 107, 88];
          const FG = [255, 255, 255];
          const A = { x: 18 / 64, y: 33.5 / 64 };
          const B = { x: 27.5 / 64, y: 43 / 64 };
          const C = { x: 46.5 / 64, y: 22 / 64 };
          const R = 3.25 / 64;
          const dist = (px, py, ax, ay, bx, by) => {
            const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
            const t = l === 0 ? 0 : Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l));
            return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
          };
          const tbl = new Uint32Array(256);
          for (let n = 0; n < 256; n += 1) {
            let c = n;
            for (let k = 0; k < 8; k += 1) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
            tbl[n] = c >>> 0;
          }
          const crc = (b) => {
            let c = 0xffffffff;
            for (let i = 0; i < b.length; i += 1) c = tbl[(c ^ b[i]) & 0xff] ^ (c >>> 8);
            return (c ^ 0xffffffff) >>> 0;
          };
          const chunk = (t, d) => {
            const tb = Buffer.from(t, 'ascii'), lb = Buffer.alloc(4), cb = Buffer.alloc(4);
            lb.writeUInt32BE(d.length, 0);
            cb.writeUInt32BE(crc(Buffer.concat([tb, d])), 0);
            return Buffer.concat([lb, tb, d, cb]);
          };
          const stride = 1 + size * 3, raw = Buffer.alloc(stride * size), aa = 1.2 / size;
          for (let y = 0; y < size; y += 1) {
            const ro = y * stride; raw[ro] = 0; const ny = (y + 0.5) / size;
            for (let x = 0; x < size; x += 1) {
              const nx = (x + 0.5) / size;
              const d = Math.min(dist(nx, ny, A.x, A.y, B.x, B.y), dist(nx, ny, B.x, B.y, C.x, C.y)) - R;
              const a = Math.max(0, Math.min(1, 0.5 - d / aa));
              const po = ro + 1 + x * 3;
              raw[po] = Math.round(BG[0] + (FG[0] - BG[0]) * a);
              raw[po + 1] = Math.round(BG[1] + (FG[1] - BG[1]) * a);
              raw[po + 2] = Math.round(BG[2] + (FG[2] - BG[2]) * a);
            }
          }
          const ihdr = Buffer.alloc(13);
          ihdr.writeUInt32BE(size, 0); ihdr.writeUInt32BE(size, 4); ihdr[8] = 8; ihdr[9] = 2;
          const png = Buffer.concat([
            Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]),
            chunk('IHDR', ihdr),
            chunk('IDAT', zlib.deflateSync(raw, { level: 9 })),
            chunk('IEND', Buffer.alloc(0)),
          ]);
          const dir = path.resolve('ios/App/App/Assets.xcassets/AppIcon.appiconset');
          fs.mkdirSync(dir, { recursive: true });
          fs.writeFileSync(path.join(dir, 'AppIcon-1024.png'), png);
          fs.writeFileSync(path.join(dir, 'Contents.json'), JSON.stringify({
            images: [{ filename: 'AppIcon-1024.png', idiom: 'universal', platform: 'ios', size: '1024x1024' }],
            info: { author: 'xcode', version: 1 }
          }, null, 2));
          EOF
          fi
          npx cap sync ios

      - name: Configure Bundle ID, Version, URL Scheme & Mac Catalyst
        if: ${{ inputs.target_platform != 'metadata-only' }}
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          INFO_PLIST="ios/App/App/Info.plist"

          sed -i '' "s/MARKETING_VERSION = .*;/MARKETING_VERSION = ${APP_VERSION};/g" "$PBXPROJ"
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*;/CURRENT_PROJECT_VERSION = ${{ inputs.build_number }};/g" "$PBXPROJ"
          sed -i '' "s/SUPPORTS_MACCATALYST = NO;/SUPPORTS_MACCATALYST = YES;/g" "$PBXPROJ" || true
          if ! grep -q "SUPPORTS_MACCATALYST" "$PBXPROJ"; then
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = /DEVELOPMENT_TEAM = ${APPLE_TEAM_ID};\n\t\t\t\tDERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER = NO;\n\t\t\t\tSUPPORTS_MACCATALYST = YES;\n\t\t\t\tSUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD = YES;\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = /g" "$PBXPROJ"
          fi

          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string ${APP_BUNDLE_ID}" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string plinglist" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$INFO_PLIST" 2>/dev/null || true

      - name: Select Latest Xcode
        if: ${{ inputs.target_platform != 'metadata-only' }}
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version | head -n 1

      - name: Install Apple Distribution Certificate & Fetch/Install Provisioning Profiles
        if: ${{ inputs.upload_to_appstore && inputs.target_platform != 'metadata-only' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          TARGET_PLATFORM: ${{ inputs.target_platform }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::Missing BUILD_CERTIFICATE_BASE64 or P12_PASSWORD secret!"
            exit 1
          fi
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_API_KEY_P8" ]; then
            echo "::error::Missing APP_STORE_CONNECT_KEY_ID / ISSUER_ID / API_KEY_P8 secrets!"
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          if ! security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"; then
            openssl pkcs12 -legacy -in "$RUNNER_TEMP/dist.p12" -passin env:P12_PASSWORD -out "$RUNNER_TEMP/dist.pem" -nodes
            openssl pkcs12 -export -in "$RUNNER_TEMP/dist.pem" -out "$RUNNER_TEMP/dist-re.p12" -passout env:P12_PASSWORD
            security import "$RUNNER_TEMP/dist-re.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          CERT_SERIAL=$( (openssl pkcs12 -legacy -in "$RUNNER_TEMP/dist.p12" -passin env:P12_PASSWORD -nokeys -clcerts 2>/dev/null || openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -passin env:P12_PASSWORD -nokeys -clcerts) | openssl x509 -noout -serial | sed 's/serial=//' | tr '[:lower:]' '[:upper:]' )
          echo "Distribution Certificate Serial: $CERT_SERIAL"

          mkdir -p "$RUNNER_TEMP/private_keys"
          (umask 077 && echo "$ASC_API_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          if [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            PP_PATH="$RUNNER_TEMP/manual.mobileprovision"
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
            UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
            NAME=$(security cms -D -i "$PP_PATH" | plutil -extract Name raw -)
            cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
            echo "IOS_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
            echo "IOS_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          fi

          CERT_SERIAL="$CERT_SERIAL" KEYCHAIN_PATH="$KEYCHAIN_PATH" KEYCHAIN_PASS="$KEYCHAIN_PASS" node - <<'EOF'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');

          function makeJwt() {
            const now = Math.floor(Date.now() / 1000);
            const b64u = (obj) => Buffer.from(JSON.stringify(obj)).toString('base64url');
            const header = b64u({ alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT' });
            const payload = b64u({ iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 900, aud: 'appstoreconnect-v1' });
            const signingInput = `${header}.${payload}`;
            const sig = crypto.sign('sha256', Buffer.from(signingInput), {
              key: process.env.ASC_API_KEY_P8,
              dsaEncoding: 'ieee-p1363',
            });
            return `${signingInput}.${sig.toString('base64url')}`;
          }

          async function asc(method, endpoint, body) {
            const res = await fetch(`https://api.appstoreconnect.apple.com/v1${endpoint}`, {
              method,
              headers: {
                Authorization: `Bearer ${makeJwt()}`,
                'Content-Type': 'application/json',
              },
              body: body ? JSON.stringify(body) : undefined,
            });
            const text = await res.text();
            if (!res.ok) {
              throw new Error(`ASC API ${method} ${endpoint} failed (${res.status}): ${text}`);
            }
            return text ? JSON.parse(text) : {};
          }

          async function ensureProfile(bundleResourceId, certId, profileType, displayName, envPrefix) {
            const existing = await asc('GET', `/profiles?filter[profileType]=${profileType}&include=bundleId`);
            const match = (existing.data || []).find(
              (p) =>
                p.attributes?.profileState === 'ACTIVE' &&
                p.relationships?.bundleId?.data?.id === bundleResourceId
            );
            let profile = match;
            if (!profile) {
              const created = await asc('POST', '/profiles', {
                data: {
                  type: 'profiles',
                  attributes: { name: `${displayName} ${Date.now()}`, profileType },
                  relationships: {
                    bundleId: { data: { type: 'bundleIds', id: bundleResourceId } },
                    certificates: { data: [{ type: 'certificates', id: certId }] },
                  },
                },
              });
              profile = created.data;
            }
            const uuid = profile.attributes.uuid;
            const name = profile.attributes.name;
            const ext = profileType === 'MAC_CATALYST_APP_STORE' ? 'provisionprofile' : 'mobileprovision';
            const dest = path.join(
              process.env.HOME,
              'Library/MobileDevice/Provisioning Profiles',
              `${uuid}.${ext}`
            );
            fs.writeFileSync(dest, Buffer.from(profile.attributes.profileContent, 'base64'));
            fs.appendFileSync(process.env.GITHUB_ENV, `${envPrefix}_PROFILE_NAME=${name}\n${envPrefix}_PROFILE_UUID=${uuid}\n`);
            console.log(`Provisioning profile ready (${profileType}): ${name} (${uuid})`);
          }

          (async () => {
            const bundleRes = await asc('GET', `/bundleIds?filter[identifier]=${encodeURIComponent(process.env.APP_BUNDLE_ID)}`);
            const bundle = (bundleRes.data || []).find((b) => b.attributes?.identifier === process.env.APP_BUNDLE_ID);
            if (!bundle) {
              console.error(`::error::Bundle ID ${process.env.APP_BUNDLE_ID} not found in Apple Developer / App Store Connect!`);
              process.exit(1);
            }
            const certsRes = await asc('GET', '/certificates?filter[certificateType]=DISTRIBUTION,IOS_DISTRIBUTION');
            const cleanSerial = (s) => (s || '').replace(/^0+/, '').toUpperCase();
            const wantedSerial = cleanSerial(process.env.CERT_SERIAL);
            const cert =
              (certsRes.data || []).find((c) => cleanSerial(c.attributes?.serialNumber) === wantedSerial) ||
              (certsRes.data || [])[0];
            if (!cert) {
              console.error('::error::No active Apple Distribution certificate found in App Store Connect!');
              process.exit(1);
            }
            console.log(`Using ASC certificate ${cert.id} (serial ${cert.attributes?.serialNumber})`);

            const target = process.env.TARGET_PLATFORM;
            if ((target === 'all' || target === 'ios') && !process.env.IOS_PROFILE_NAME) {
              await ensureProfile(bundle.id, cert.id, 'IOS_APP_STORE', 'Plinglist iOS AppStore', 'IOS');
            }
            if (target === 'all' || target === 'macos') {
              await ensureProfile(bundle.id, cert.id, 'MAC_CATALYST_APP_STORE', 'Plinglist Mac Catalyst AppStore', 'MAC');
            }
          })().catch((err) => {
            console.error(`::error::${err.message}`);
            process.exit(1);
          });
          EOF

      - name: Archive & Upload iOS (iPhone / iPad)
        if: ${{ inputs.target_platform == 'all' || inputs.target_platform == 'ios' }}
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -d App.xcworkspace ]; then
            CONTAINER_FLAG="-workspace"
            CONTAINER_NAME="App.xcworkspace"
          else
            CONTAINER_FLAG="-project"
            CONTAINER_NAME="App.xcodeproj"
          fi
          echo "Using $CONTAINER_FLAG $CONTAINER_NAME"

          if [ "${{ inputs.upload_to_appstore }}" = "true" ]; then
            IOS_PROFILE_NAME="$IOS_PROFILE_NAME" APPLE_TEAM_ID="$APPLE_TEAM_ID" node - <<'EOF'
          const fs = require('node:fs');
          const pbxPath = 'App.xcodeproj/project.pbxproj';
          let pbx = fs.readFileSync(pbxPath, 'utf8');
          pbx = pbx.replace(/CODE_SIGN_STYLE = Automatic;/g, 'CODE_SIGN_STYLE = Manual;');
          pbx = pbx.replace(/"?CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]"? = ".*?";/g, '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";');
          pbx = pbx.replace(/CODE_SIGN_IDENTITY = ".*?";/g, 'CODE_SIGN_IDENTITY = "Apple Distribution";');
          pbx = pbx.replace(/PROVISIONING_PROFILE_SPECIFIER = ".*?";/g, `PROVISIONING_PROFILE_SPECIFIER = "${process.env.IOS_PROFILE_NAME}";`);
          if (!pbx.includes('PROVISIONING_PROFILE_SPECIFIER')) {
            pbx = pbx.replace(
              /PRODUCT_BUNDLE_IDENTIFIER = de\.goork\.plinglist;/g,
              `CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "${process.env.IOS_PROFILE_NAME}";\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = de.goork.plinglist;`
            );
          }
          fs.writeFileSync(pbxPath, pbx);
          EOF

            if ! xcodebuild archive \
              "$CONTAINER_FLAG" "$CONTAINER_NAME" \
              -scheme App \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$RUNNER_TEMP/Plinglist-iOS.xcarchive" \
              DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" > "$RUNNER_TEMP/ios-archive.log" 2>&1; then
              tail -n 60 "$RUNNER_TEMP/ios-archive.log"
              ERR_LINE=$(grep -m1 "error:" "$RUNNER_TEMP/ios-archive.log" || echo "iOS xcodebuild archive failed")
              echo "::error::${ERR_LINE}"
              exit 1
            fi

            cat > "$RUNNER_TEMP/ExportOptions-iOS.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key>
              <string>${IOS_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

            if ! xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/Plinglist-iOS.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-iOS.plist" \
              -exportPath "$RUNNER_TEMP/export-ios" > "$RUNNER_TEMP/ios-export.log" 2>&1; then
              tail -n 60 "$RUNNER_TEMP/ios-export.log"
              ERR_LINE=$(grep -m1 "error:" "$RUNNER_TEMP/ios-export.log" || echo "iOS xcodebuild exportArchive failed")
              echo "::error::${ERR_LINE}"
              exit 1
            fi

            IPA_FILE=$(ls "$RUNNER_TEMP"/export-ios/*.ipa | head -n 1)
            mkdir -p ~/.appstoreconnect/private_keys
            cp "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" ~/.appstoreconnect/private_keys/
            xcrun altool --upload-app -f "$IPA_FILE" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          else
            xcodebuild archive \
              "$CONTAINER_FLAG" "$CONTAINER_NAME" \
              -scheme App \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$RUNNER_TEMP/Plinglist-iOS.xcarchive" \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Archive & Upload macOS (Mac Catalyst)
        if: ${{ inputs.target_platform == 'all' || inputs.target_platform == 'macos' }}
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -d App.xcworkspace ]; then
            CONTAINER_FLAG="-workspace"
            CONTAINER_NAME="App.xcworkspace"
          else
            CONTAINER_FLAG="-project"
            CONTAINER_NAME="App.xcodeproj"
          fi

          if [ "${{ inputs.upload_to_appstore }}" = "true" ]; then
            MAC_PROFILE_NAME="$MAC_PROFILE_NAME" APPLE_TEAM_ID="$APPLE_TEAM_ID" node - <<'EOF'
          const fs = require('node:fs');
          const teamId = process.env.APPLE_TEAM_ID;
          const pbxPath = 'App.xcodeproj/project.pbxproj';
          let pbx = fs.readFileSync(pbxPath, 'utf8');
          pbx = pbx.replace(/CODE_SIGN_STYLE = Automatic;/g, 'CODE_SIGN_STYLE = Manual;');
          pbx = pbx.replace(/"?CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]"? = ".*?";/g, '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";');
          pbx = pbx.replace(/"?CODE_SIGN_IDENTITY\[sdk=macosx\*\]"? = ".*?";/g, '"CODE_SIGN_IDENTITY[sdk=macosx*]" = "Apple Distribution";');
          pbx = pbx.replace(/CODE_SIGN_IDENTITY = ".*?";/g, 'CODE_SIGN_IDENTITY = "Apple Distribution";');
          pbx = pbx.replace(/PROVISIONING_PROFILE_SPECIFIER = ".*?";/g, `PROVISIONING_PROFILE_SPECIFIER = "${process.env.MAC_PROFILE_NAME}";`);
          if (!pbx.includes('PROVISIONING_PROFILE_SPECIFIER')) {
            pbx = pbx.replace(
              /PRODUCT_BUNDLE_IDENTIFIER = de\.goork\.plinglist;/g,
              `CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=macosx*]" = "Apple Distribution";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "${process.env.MAC_PROFILE_NAME}";\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = de.goork.plinglist;`
            );
          }
            const entitlementsPath = 'App/App.entitlements';
            if (!fs.existsSync(entitlementsPath)) {
              fs.writeFileSync(
                entitlementsPath,
                `<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n\t<key>com.apple.security.app-sandbox</key>\n\t<true/>\n\t<key>com.apple.security.network.client</key>\n\t<true/>\n</dict>\n</plist>\n`
              );
            }
            if (!pbx.includes('CODE_SIGN_ENTITLEMENTS')) {
              pbx = pbx.replace(
                /PRODUCT_BUNDLE_IDENTIFIER = de\.goork\.plinglist;/g,
                `CODE_SIGN_ENTITLEMENTS = App/App.entitlements;\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = de.goork.plinglist;`
              );
            }
            fs.writeFileSync(pbxPath, pbx);

          const podsPath = 'Pods/Pods.xcodeproj/project.pbxproj';
          if (fs.existsSync(podsPath)) {
            let pods = fs.readFileSync(podsPath, 'utf8');
            pods = pods.replace(/CODE_SIGN_STYLE = Automatic;/g, 'CODE_SIGN_STYLE = Manual;');
            pods = pods.replace(/"?CODE_SIGN_IDENTITY\[sdk=macosx\*\]"? = ".*?";/g, '"CODE_SIGN_IDENTITY[sdk=macosx*]" = "Apple Distribution";');
            pods = pods.replace(/CODE_SIGN_IDENTITY = ".*?";/g, 'CODE_SIGN_IDENTITY = "Apple Distribution";');
            pods = pods.replace(/DEVELOPMENT_TEAM = .*?;/g, `DEVELOPMENT_TEAM = ${teamId};`);
            pods = pods.replace(
              /buildSettings = \{/g,
              `buildSettings = {\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=macosx*]" = "Apple Distribution";\n\t\t\t\tDEVELOPMENT_TEAM = ${teamId};`
            );
            fs.writeFileSync(podsPath, pods);
          }
          EOF

            if ! xcodebuild archive \
              "$CONTAINER_FLAG" "$CONTAINER_NAME" \
              -scheme App \
              -configuration Release \
              -destination "generic/platform=macOS,variant=Mac Catalyst" \
              -archivePath "$RUNNER_TEMP/Plinglist-macOS.xcarchive" \
              DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" > "$RUNNER_TEMP/mac-archive.log" 2>&1; then
              tail -n 60 "$RUNNER_TEMP/mac-archive.log"
              ERR_LINE=$(grep -m1 "error:" "$RUNNER_TEMP/mac-archive.log" || echo "macOS xcodebuild archive failed")
              echo "::error::${ERR_LINE}"
              exit 1
            fi

            cat > "$RUNNER_TEMP/ExportOptions-macOS.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>installerSigningCertificate</key>
            <string>3rd Party Mac Developer Installer</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key>
              <string>${MAC_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

            if ! xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/Plinglist-macOS.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-macOS.plist" \
              -exportPath "$RUNNER_TEMP/export-macos" \
              -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
              -authenticationKeyID "${ASC_KEY_ID}" \
              -authenticationKeyIssuerID "${ASC_ISSUER_ID}" > "$RUNNER_TEMP/mac-export.log" 2>&1; then
              tail -n 60 "$RUNNER_TEMP/mac-export.log"
              ERR_LINE=$(grep -m1 "error:" "$RUNNER_TEMP/mac-export.log" || echo "macOS xcodebuild exportArchive failed")
              echo "::error::${ERR_LINE}"
              exit 1
            fi
          else
            xcodebuild archive \
              "$CONTAINER_FLAG" "$CONTAINER_NAME" \
              -scheme App \
              -configuration Release \
              -destination "generic/platform=macOS,variant=Mac Catalyst" \
              -archivePath "$RUNNER_TEMP/Plinglist-macOS.xcarchive" \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Sync App Store Connect Version (0.1.19), Texts & Screenshots
        if: ${{ inputs.upload_to_appstore && (inputs.target_platform == 'ios' || inputs.target_platform == 'metadata-only' || inputs.target_platform == 'all') }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          if [ -f cloud/scripts/sync-appstore-metadata.mjs ]; then
            node cloud/scripts/sync-appstore-metadata.mjs
          else
            echo "::error::Missing cloud/scripts/sync-appstore-metadata.mjs (ensure CLOUD_SSH_KEY is configured)."
            exit 1
          fi

      - name: Cleanup Keys
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/dist-re.p12" "$RUNNER_TEMP/dist.pem" ~/.appstoreconnect/private_keys
